name: Publish

# Run manually from the Actions tab on the branch to release (usually main).
# The version comes from `version` in alert-banner/build.gradle.kts.
#
# Swift Package Manager pins a version tag to one commit, and Package.swift must hold the
# XCFramework's checksum. So the framework is built first, Package.swift is committed with
# its checksum, and only then is the tag created on that commit. The tag is never moved.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Read version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version = "(.*)"$/\1/p' alert-banner/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in alert-banner/build.gradle.kts"
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version in alert-banner/build.gradle.kts first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build XCFramework
        run: ./gradlew :alert-banner:assembleAlertBannerReleaseXCFramework --no-configuration-cache
      - name: Zip XCFramework
        run: |
          cd alert-banner/build/XCFrameworks/release
          zip -r "$GITHUB_WORKSPACE/AlertBanner.xcframework.zip" AlertBanner.xcframework
      - name: Commit Package.swift and tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          CHECKSUM=$(swift package compute-checksum AlertBanner.xcframework.zip)
          sed -i '' "s|url: \".*AlertBanner.xcframework.zip\"|url: \"https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/AlertBanner.xcframework.zip\"|" Package.swift
          sed -i '' "s|checksum: \".*\"|checksum: \"$CHECKSUM\"|" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Update Package.swift for $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" AlertBanner.xcframework.zip --verify-tag --title "$TAG" --generate-notes $PRERELEASE
      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
